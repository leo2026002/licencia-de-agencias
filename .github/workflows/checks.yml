name: Verificar panel
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:db
      - run: npm run test:ui
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: panel-compilado
          path: |
            dist/
            scripts/start.mjs
            INICIAR-WINDOWS.bat
            INICIAR-MAC-LINUX.sh
            schema.sql
            README.md
